# hzip 合规配置（04 §9）：运行时依赖白名单制；与 GPLv3 不兼容的协议拒绝进入链接边界；
# unrar 的 C 库义务见 [licenses] 段尾注释（cargo-deny 看不到 C 源码的许可）。
[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
           "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
           "x86_64-apple-darwin", "aarch64-apple-darwin"]

[advisories]
# `version` 已弃用（0.18.4 起移除 vulnerability/notice/severity-threshold 等键语义）。
yanked = "deny"
# unmaintained = "workspace"（默认是 "all"）：**只对直接依赖**报「无人维护」——
#   本仓库的 6 条 unmaintained 里有 5 条来自上游链条（instant/paste/rustybuzz/ttf-parser
#   来自 gpui，unsafe-libyaml 来自 rust-i18n 的 serde_yaml），我们无权也无力修，
#   卡在门禁上只会让每次发版变红而不产生任何行动。**direct** 依赖的 unmaintained 仍然报错
#   （sevenz-rust 就是 direct，见下方 ignore 的逐条理由）。
#   想按最严口径自查：把这里临时改成 "all" 再跑 `cargo deny check advisories`。
unmaintained = "workspace"
unused-ignored-advisory = "warn"
ignore = [
  # ── sevenz-rust（**直接依赖**，7z 格式）：两条都留了逐条理由，别当噪音 ─────────
  #   ① RUSTSEC-2026-0245 的路径穿越在 sevenz_rust::de_funcs::decompress_impl（落盘辅助）
  #      里。本项目从不调用它：7z 解压在 hzip-fmt-7z/src/reader.rs:705 走
  #      BlockDecoder::for_each_entries 拿流式 Read，再由 hzip-format 的路径净化
  #      （02 §9.6）决定落盘位置 ⇒ 那个函数不在调用链上。
  #   ② 0.6 停更、无修复版本；7z 读写是核心能力，暂无平替，跟踪上游。
  { id = "RUSTSEC-2026-0245", reason = "漏洞位于 de_funcs::decompress_impl（落盘辅助）；本项目只走 BlockDecoder::for_each_entries + 自净化写盘（reader.rs:705、02 §9.6）" },
  { id = "RUSTSEC-2026-0246", reason = "sevenz-rust 0.6 已停更；7z 是核心能力暂无平替，解压/写盘路径已自持" },
  # ── quick-xml（传递依赖，Linux 无障碍栈）：上游把版本锁在 ^0.38，就地升级不可能 ─
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38.4 由 zbus_xml 5.1 固定（^0.38）；该解析器只处理本机 D-Bus 的 XML，非用户输入" },
  { id = "RUSTSEC-2026-0195", reason = "同上（NsReader 内存放大）；输入限于本机 D-Bus XML" },
]

[licenses]
# 白名单制（04 §9）：**不在 allow 里的许可一律拒绝**——现在的 cargo-deny 已把
# `default`/`deny`/`copyleft`/`allow-osi-fsf-free`/`unlicensed` 全部删除（配了就报
# deprecated 硬错误），语义改成「默认拒绝」内建，故这里只留 allow + exceptions。
# 与 GPLv3 不兼容者（GPL-2.0-only / LGPL-2.0-only / LGPL-2.1-only / AGPL-* / SSPL-1.0）
# 靠**不写进 allow** 来拒绝：以前那份显式 deny 列表已无对应键。
# ⚠ 这里**不能写** `copy-files`：那是 `cargo about` 的键，cargo-deny 的 [licenses] 不认
#   （serde 未知键 = 直接解析失败：CI 实测 `found 1 unexpected keys` 把整条 deny 门禁搞红）。
#   同理 allow 的条目只能是**单个** SPDX 许可 id（可带 `WITH` 例外）——不能写
#   `MIT OR Apache-2.0` 这类表达式（解析器只接受 id 或 id WITH exception，实测报
#   `expected a WITH here`）。双许可的 crate 只要两个 id 都在 allow 里就算通过。
# `unused-allowed-license = "allow"`：本列表**故意**为将来留了 GPLv3 兼容协议
#   （04 §9 口径），当前依赖树用不到它们 → 不把「未用到的 allow 项」当问题报。
unused-allowed-license = "allow"
unused-license-exception = "warn"
confidence-threshold = 0.93
allow = [
  "MIT", "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0", "Unicode-DFS-2016",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "CC0-1.0",
  "MPL-2.0",
  # 本项目自身以 GPL-3.0-or-later 发布（04 §9）⇒ 与 GPLv3 **兼容**的传染协议可以进入
  # 链接边界（**与 GPLv3 不兼容**的 GPL-2.0-only / LGPL-2.0-only / LGPL-2.1-only /
  # AGPL-* / SSPL-1.0 一律不进本列表 = 被默认拒绝，口径见 04 §9）。
  "GPL-3.0", "GPL-3.0-only", "GPL-3.0-or-later",
  "LGPL-3.0", "LGPL-3.0-only", "LGPL-3.0-or-later",
  "GPL-2.0-or-later",
  # bzip2 的许可（libbz2-rs-sys ← bzip2 ← zip / gpui 的 http 客户端链）。
  # 它是宽松、与 GPLv3 兼容的协议（无 copyleft），故整体放行。
  "bzip2-1.0.6",
]

# unrar 的**C 源码**（unrar_sys 内自带）是 UnRAR 许可（允许解压用途免费分发、禁止拿它
# 重实现 RAR 创建）——hzip 仅解压（D2），约束满足；发行版合规构建可 --no-default-features
# 剔除（04 §3.2）。但**这两个 Rust crate 的清单声明是 `MIT OR Apache-2.0`**
# （见 registry 里 unrar-0.5.8 / unrar_sys-0.5.8 的 Cargo.toml），cargo-deny 只看清单，
# 于是原先那两条 `[[licenses.exceptions]] allow = ["UnRAR"]` 永远匹配不上、每次跑都报
# `license-exception-not-encountered`（实测）。故删除：真正的义务登记在 04 §9 与本注释里，
# 而不是靠一条永不生效的配置来「显得合规」。哪天上游改成声明 UnRAR，这里会**直接失败**——
# 那正是我们想要的行为（届时再按实情加回例外）。

[bans]
multiple-versions = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
