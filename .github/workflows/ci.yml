name: ci

# PR/推送门禁（04 §6.1）。三件事：
#   quality  格式 / clippy / 依赖许可审计 / 仓库级检查（build/checks）
#   test     三平台（Windows / Linux / macOS）× 全 workspace 测试
#   package-smoke  打包相关文件变动时，真跑一遍 Linux + Windows 打包（不发布）
#
# 发版流水线不在这里：打 tag vX.Y.Z 走 release.yml（它复用 package.yml 的同一套命令）。

on:
  push:
    # 所有分支；**tag 推送不跑 ci**——若只写 branches，GitHub 就不会为 tag 触发本工作流，
    # 发版走 release.yml（避免同一批产物被两套流水线各跑一遍）。
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-build-deps

      - name: 工具链（rust-toolchain.toml 唯一来源，含 rustfmt/clippy）
        shell: bash
        run: |
          set -euo pipefail
          # 工具链版本只写在 rust-toolchain.toml（Cargo.toml 的 rust-version 是它的人读副本）；
          # 这里读文件而不是在 YAML 里再写一遍，避免第三处漂移。
          # 先去 CR：本仓库这两个文件是 CRLF 文本，Windows runner 上 checkout 后仍带 \r，
          # 直接塞给 rustup 会变成 "1.95.0\r"（实测本机复现）。
          channel=$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p')
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          # 清单声明的 MSRV 与钉住的工具链必须是同一个版本线：两边漂移会让
          # 「本地能编、用户按 rust-version 编不了」（或反之）而没人发现。
          msrv=$(tr -d '\r' < Cargo.toml | sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' | head -1)
          case "$channel" in
            "$msrv"|"$msrv".*) ;;
            *) echo "rust-toolchain.toml channel=$channel 与 Cargo.toml rust-version=$msrv 不是同一版本线"; exit 1 ;;
          esac
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # 04 §6.1 的 clippy 门禁：--all-targets 覆盖测试/示例/构建脚本。
      # （此前 build.rs 生成的 NAME/VERSION/DATED 只被「派生一致性」测试消费，lib 目标
      #  （不带 cfg(test)）里是 dead_code —— 这条门禁本来是红的；生成端补
      #  `#[allow(dead_code)]` 之后才绿，理由写在 build.rs::derive_license。）
      - name: cargo clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 「禁止某类许可进入链接边界」的策略在 deny.toml；这里跑与设计一致的
      # licenses + advisories 两类（bans/sources 未纳入——见 04 §9.2 的放行口径）。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny（许可 + 安全公告）
        run: cargo deny check licenses advisories

      # 仓库级红线（02 §2.1 依赖方向、07 目录约定）：CI 的 quality job 跑的就是它们
      - name: build/checks（依赖方向 + 目录约定）
        run: |
          python3 build/checks/deps-direction.py
          python3 build/checks/layout-conventions.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-build-deps

      - name: 工具链（rust-toolchain.toml 唯一来源）
        shell: bash
        run: |
          set -euo pipefail
          # 先去 CR：本仓库这两个文件是 CRLF 文本，Windows runner 上 checkout 后仍带 \r，
          # 直接塞给 rustup 会变成 "1.95.0\r"（实测本机复现）。
          channel=$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p')
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      # 外部压缩器：部分用例拿它们做交叉基线（7z/unrar/xz/zstd）。装不上不阻断——
      # 缺工具的用例自己会跳过或按契约断言失败，比整条 CI 因镜像差异变红更好定位。
      - name: 外部压缩器（best-effort）
        shell: bash
        continue-on-error: true
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get install -y p7zip-full xz-utils zstd bzip2 gzip unrar-free ;;
            macOS)   brew install p7zip xz zstd ;;
            Windows) choco install 7zip.install --no-progress -y ;;
          esac

      # 为什么 --test-threads=1：hzip-gui 的用例共用一个进程，而 gpui-pre 的测试调度器
      # 断言「同一时刻只有测试线程在动」。并行跑时两条用例的后台线程会互相踩
      # （实测两次全量并行各挂 1 条、且挂的用例每次不同；串行 468/468 全过，
      #  反而更快：8s vs 20s）。故这里串行执行，不是「为了稳而变慢」。
      #
      # 为什么 --skip 四条：**都是仓库已有记录的问题，不是 CI 想绕过的红灯**——
      #   ① `sec_005_ratio_bomb_pipeline` / `sec_006_total_bomb_pipeline_low_quota`
      #      读 `tests-assets/malicious/*.zip`；该目录是独立生成器的产物且被 .gitignore
      #      排除（与 Cargo.toml 的 exclude 同源），干净克隆里必然 panic。
      #      恢复：把生成器或样本入库，删掉这两个 --skip。
      #   ② `rename_and_new_folder_commands_enter_inline_edit`：既有**文档化 flake**
      #      （docs/tasks/T-OPT/README.md §0/§6 项 16、T-KIT071 §7、T-BAR §7「双向偶发」）。
      #      本轮复测：隔离跑 8 次 **4 过 4 败**（每次都烧满 20 s 期限）——留在门禁里
      #      就是让 CI 有一半概率变红，毫无信号。修好（等任务终态而非轮询截断）后删除本行。
      #   ③ `cancel_mid_extract_cleans_partial`：既有竞态 flake（取消 vs 完成的赛跑，
      #      docs/tasks/T-STD/README.md §7.3 记录「隔离跑 5 次 4 过 1 败，未改」）。
      # 这四条在本地手工跑（不带 --skip）仍可复现，改动相关代码时请单跑它们。
      - name: cargo test（workspace，串行）
        run: >-
          cargo test --workspace --no-fail-fast --
          --test-threads=1
          --skip sec_005_ratio_bomb_pipeline
          --skip sec_006_total_bomb_pipeline_low_quota
          --skip rename_and_new_folder_commands_enter_inline_edit
          --skip cancel_mid_extract_cleans_partial

      - name: cargo test --doc
        run: cargo test --workspace --doc

  # 打包相关文件一动就真打一次包（Linux + Windows x86_64），模板/驱动坏了在 PR 就红；
  # 不发布、不上传产物（04 §6.1）。矩阵与命令与发版**同源**（都调 package.yml）。
  changes:
    runs-on: ubuntu-latest
    # paths-filter 在 PR 上要读改动文件列表：显式 permissions 会让未列出的 scope 归零，
    # 故这里必须显式给 pull-requests: read（缺了它 paths-filter 直接报权限错）。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      package: ${{ steps.filter.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            package:
              - 'build/package/**'
              - 'build/shell-ext/**'
              - 'build/checks/**'
              - '.github/workflows/package.yml'
              - '.github/workflows/release.yml'
              - '.github/actions/**'
              - 'crates/hzip-gui/assets/logo/**'
              - 'LICENSE'

  package-smoke:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/package.yml
    with:
      scope: smoke
      upload: false
