name: ci

# PR/推送门禁（04 §6.1）。三件事：
#   quality  格式 / clippy / 依赖许可审计 / 仓库级检查（build/checks）
#   test     三平台（Windows / Linux / macOS）× 全 workspace 测试
#   package-smoke  打包相关文件变动时，真跑一遍 Windows + macOS + Linux 打包（不发布）
#
# 发版流水线不在这里：打 tag vX.Y.Z 走 release.yml（它复用 package.yml 的同一套命令）。

on:
  push:
    # 所有分支；**tag 推送不跑 ci**——若只写 branches，GitHub 就不会为 tag 触发本工作流，
    # 发版走 release.yml（避免同一批产物被两套流水线各跑一遍）。
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-build-deps

      - name: 工具链（rust-toolchain.toml 唯一来源，含 rustfmt/clippy）
        shell: bash
        run: |
          set -euo pipefail
          # 工具链版本只写在 rust-toolchain.toml（Cargo.toml 的 rust-version 是它的人读副本）；
          # 这里读文件而不是在 YAML 里再写一遍，避免第三处漂移。
          # 先去 CR：本仓库这两个文件是 CRLF 文本，Windows runner 上 checkout 后仍带 \r，
          # 直接塞给 rustup 会变成 "1.95.0\r"（实测本机复现）。
          channel=$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p')
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          # 清单声明的 MSRV 与钉住的工具链必须是同一个版本线：两边漂移会让
          # 「本地能编、用户按 rust-version 编不了」（或反之）而没人发现。
          msrv=$(tr -d '\r' < Cargo.toml | sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' | head -1)
          case "$channel" in
            "$msrv"|"$msrv".*) ;;
            *) echo "rust-toolchain.toml channel=$channel 与 Cargo.toml rust-version=$msrv 不是同一版本线"; exit 1 ;;
          esac
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # 04 §6.1 的 clippy 门禁：--all-targets 覆盖测试/示例/构建脚本。
      # （此前 build.rs 生成的 NAME/VERSION/DATED 只被「派生一致性」测试消费，lib 目标
      #  （不带 cfg(test)）里是 dead_code —— 这条门禁本来是红的；生成端补
      #  `#[allow(dead_code)]` 之后才绿，理由写在 build.rs::derive_license。）
      - name: cargo clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 「禁止某类许可进入链接边界」的策略在 deny.toml；这里跑与设计一致的
      # licenses + advisories 两类（bans/sources 未纳入——见 04 §9.2 的放行口径）。
      # 版本 pin：cargo-deny 的配置 schema 换过几轮（0.18.4 起 [licenses] 的
      # default/deny/copyleft/… 直接被删、配了就报 deprecated 硬错误），不 pin 就等于
      # 让上游某天的 schema 变更把我们的门禁搞红。升级时先本地跑一遍再改这里。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny（许可 + 安全公告）
        run: cargo deny check licenses advisories

      # 仓库级红线（02 §2.1 依赖方向、07 目录约定）：CI 的 quality job 跑的就是它们
      - name: build/checks（依赖方向 + 目录约定）
        run: |
          python3 build/checks/deps-direction.py
          python3 build/checks/layout-conventions.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-build-deps

      - name: 工具链（rust-toolchain.toml 唯一来源）
        shell: bash
        run: |
          set -euo pipefail
          # 先去 CR：本仓库这两个文件是 CRLF 文本，Windows runner 上 checkout 后仍带 \r，
          # 直接塞给 rustup 会变成 "1.95.0\r"（实测本机复现）。
          channel=$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p')
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      # 外部压缩器：仓库里唯一外呼外部工具做交叉基线的是
      # `crates/hzip-fmt-7z/tests/format.rs::external_sevenzip_lzma2_read`（`Command::new("7z")`），
      # 且它探不到 7z 时**直接返回**（既有约定：缺工具就跳过）。所以这一步不是硬需求，
      # 但既然装了就把 PATH 配对——上一版 Windows 侧 `choco install 7zip.install` 只落盘、
      # 没把 `C:\Program Files\7-Zip` 放进 PATH（还带 continue-on-error），结果是「装了等于没装」：
      # 那条用例在 CI 上永远走跳过分支，本地却真跑。这里把它修好，让 CI 与本地口径一致。
      #   Linux：p7zip-full 提供 `7z`；**不装 unrar-free**——它读不了 rar5，装上反而让
      #          「有 unrar」的分支走到失败；真 rar 样本用例本就 #[ignore]。
      #   macOS：brew 的 p7zip 提供 `7z`；tar/gzip/bzip2 系统自带。
      # 装完把体检结果打进日志：缺哪个工具一眼可见，不用去猜测试为什么红。
      - name: 外部压缩器（7z/xz/zstd…）
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows)
              choco install 7zip.install --no-progress -y
              echo 'C:\Program Files\7-Zip' >> "$GITHUB_PATH"
              ;;
            Linux)
              sudo apt-get update
              sudo apt-get install -y p7zip-full xz-utils zstd bzip2 gzip
              ;;
            macOS)
              brew install p7zip xz zstd
              ;;
          esac

      # 装完在**下一个步骤**做体检：$GITHUB_PATH 只对后续步骤生效，同一步里 `command -v`
      # 看不到 Windows 刚加的目录（误报「缺」）。
      # 缺 7z **不红**：仓库里用到外部 7z 的用例（`hzip-fmt-7z/tests/format.rs` 的
      # `external_sevenzip_lzma2_read`）检测不到就直接返回——这是既有约定，CI 不该
      # 因为一个可选工具把整条测试门禁搞红。缺了就告警，方便对照日志排查。
      - name: 外部压缩器体检
        shell: bash
        run: |
          for t in 7z tar xz zstd bzip2 gzip; do
            printf '%-6s ' "$t"
            command -v "$t" || command -v "$t.exe" || echo '(缺)'
          done
          if ! { command -v 7z >/dev/null || command -v 7z.exe >/dev/null; }; then
            echo "::warning::PATH 上没有 7z——依赖外部 7-Zip 的用例会自行跳过（既有约定）"
          fi

      # 为什么 --test-threads=1：hzip-gui 的用例共用一个进程，而 gpui-pre 的测试调度器
      # 断言「同一时刻只有测试线程在动」。并行跑时两条用例的后台线程会互相踩
      # （实测两次全量并行各挂 1 条、且挂的用例每次不同；串行 468/468 全过，
      #  反而更快：8s vs 20s）。故这里串行执行，不是「为了稳而变慢」。
      #
      # 为什么 --skip 两条：**都是仓库已有记录的 flake，不是 CI 想绕过的红灯**——
      #   ① `rename_and_new_folder_commands_enter_inline_edit`：既有**文档化 flake**
      #      （docs/tasks/T-OPT/README.md §0/§6 项 16、T-KIT071 §7、T-BAR §7「双向偶发」）。
      #      本轮复测：隔离跑 8 次 **4 过 4 败**（每次都烧满 20 s 期限）——留在门禁里
      #      就是让 CI 有一半概率变红，毫无信号。修好（等任务终态而非轮询截断）后删除本行。
      #   ② `cancel_mid_extract_cleans_partial`：既有竞态 flake（取消 vs 完成的赛跑，
      #      docs/tasks/T-STD/README.md §7.3 记录「隔离跑 5 次 4 过 1 败，未改」）。
      # 这两条在本地手工跑（不带 --skip）仍可复现，改动相关代码时请单跑它们。
      #
      # 注：`sec_005_ratio_bomb_pipeline` / `sec_006_total_bomb_pipeline_low_quota`
      # 原先也在这份 --skip 名单里（样本在 `tests-assets/`，而那目录不入库）。
      # 2026-10-13 起样本改为**测试内自造**（`malicious_extract.rs::build_*_bomb`），
      # 两条用例在任何环境都能跑 ⇒ 已从名单删除。
      - name: cargo test（workspace，串行）
        shell: bash
        env:
          # 失败时给 panic 带 backtrace：CI-only 的失败（本机全绿）最缺的就是「在哪一行炸的」，
          # 而这段输出会连同 test.log 一起留在日志/artifact 里。
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          # 输出同时落 test.log：CI 上这种「N 个 target 失败」的失败必须能整段留存——
          # 日志界面翻不动、也不方便贴给别人时，可从 Artifacts 下 test-log-<os> 取全文。
          cargo test --workspace --no-fail-fast -- \
            --test-threads=1 \
            --skip rename_and_new_folder_commands_enter_inline_edit \
            --skip cancel_mid_extract_cleans_partial 2>&1 | tee test.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-log-${{ matrix.os }}
          path: test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: cargo test --doc
        run: cargo test --workspace --doc

  # 打包相关文件一动就真打一次包（Linux + Windows x86_64），模板/驱动坏了在 PR 就红；
  # 不发布、不上传产物（04 §6.1）。矩阵与命令与发版**同源**（都调 package.yml）。
  changes:
    runs-on: ubuntu-latest
    # paths-filter 在 PR 上要读改动文件列表：显式 permissions 会让未列出的 scope 归零，
    # 故这里必须显式给 pull-requests: read（缺了它 paths-filter 直接报权限错）。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      package: ${{ steps.filter.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            package:
              - 'build/package/**'
              - 'build/shell-ext/**'
              - 'build/checks/**'
              - '.github/workflows/package.yml'
              - '.github/workflows/release.yml'
              - '.github/actions/**'
              - 'crates/hzip-gui/assets/logo/**'
              - 'LICENSE'

  package-smoke:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/package.yml
    with:
      scope: smoke
      upload: false
