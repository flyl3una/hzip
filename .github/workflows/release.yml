name: release

# 发版流水线（04 §6.1 / §7）：
#   打 tag vX.Y.Z 并 push → package（矩阵 5 格）→ verify-msi（真装真卸）→ release（建 Release）
#   手动触发 = 演练：给一个**已存在**的 tag；dry_run=true 时只跑流水线、不建 Release。
#
# 为什么 --check-tag 必传：产物文件名里的版本号只有一处来源（根 Cargo.toml
# [workspace.package].version）。tag 与清单不一致（例如 tag v0.1.3 而清单还是 0.1.2）
# 必须在**建 Release 之前**炸掉，而不是产出一批名字与 tag 不符的包
# （build/package/README.md「失败即停」）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建发布的版本 tag（如 v0.1.2；须已存在且与 Cargo.toml 版本一致）
        required: true
        type: string
      dry_run:
        description: 只跑流水线不建 Release（演练用）
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 全平台矩阵：Windows x86_64/arm64（msi,zip）、macOS universal（dmg,tar.gz）、
  # Linux x86_64/arm64（tar.gz,deb,rpm,appimage）。矩阵与产物见 04 §5 与 package.yml。
  package:
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      version_tag: ${{ inputs.tag || github.ref_name }}
      scope: all
      upload: true

  # MSI 真装真卸（04 §8 的自动化版）：静默装 → 断言文件/注册表/快捷方式/PATH/CLI 可跑
  # → 静默卸 → 断言无残留。装的是**这次要发布的那个 MSI**，不是本地某份。
  verify-msi:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist-installers

      - name: 定位 MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist-installers -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "windows-x86_64 artifact 里没有 .msi" }
          Write-Host "MSI = $($msi.FullName)"
          "path=$($msi.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: 静默安装
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i", "${{ steps.msi.outputs.path }}", "/qn", "/norestart", "/l*v", "install.log")
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "msiexec /i 退出码 $($p.ExitCode)" }

      - name: 断言落位（文件 + 快捷方式 + PATH + 注册表 + CLI 可跑）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:ProgramFiles "hzip"

          # ① 文件：MSI 的 ComponentGroup MainComponents + ShellExt（若本次带载荷）
          foreach ($f in @("hzip.exe", "hzip-gui.exe", "LICENSE")) {
            $p = Join-Path $dir $f
            if (-not (Test-Path $p)) { throw "安装目录缺 $f（$dir）" }
          }
          if (Test-Path (Join-Path $dir "hzip-shell.dll")) {
            Write-Host "壳扩展载荷在位（hzip-shell.dll + 稀疏包随 MSI 装入）"
            if (-not (Test-Path (Join-Path $dir "hzip-shellmenu.msix"))) {
              throw "有 hzip-shell.dll 但没有 hzip-shellmenu.msix——MSI 只装了一半"
            }
          } else {
            Write-Host "::warning::本 MSI 不含壳扩展载荷（package job 的 shell-ext 步骤失败？见其日志）"
          }

          # ② 开始菜单 / 桌面快捷方式（组件 DesktopShortcut / StartMenuShortcut）
          foreach ($lnk in @(
            (Join-Path $env:PUBLIC "Desktop\hzip.lnk"),
            (Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\hzip\hzip.lnk"))) {
            if (-not (Test-Path $lnk)) { throw "快捷方式缺失：$lnk" }
          }

          # ③ 系统 PATH 追加了安装目录（组件 PathEnv，Part=last / System=yes）
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($machinePath -notlike "*$dir*") { throw "机器 PATH 里没有安装目录：$machinePath" }

          # ④ 注册表：App Paths / ProgID / RegisteredApplications + Capabilities
          $appPath = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\hzip.exe")."(default)"
          if ($appPath -ne (Join-Path $dir "hzip.exe")) { throw "App Paths\hzip.exe = $appPath" }
          if (-not (Test-Path "HKLM:\SOFTWARE\Classes\hzip.Archive\shell\open\command")) {
            throw "ProgID hzip.Archive 未登记"
          }
          $ra = (Get-ItemProperty "HKLM:\SOFTWARE\RegisteredApplications").hzip
          if (-not $ra) { throw "RegisteredApplications 里没有 hzip" }
          if (-not (Test-Path "HKLM:\SOFTWARE\hzip\Capabilities")) { throw "Capabilities 未写" }

          # ⑤ 产物真的能跑（不是只有一个同名文件）：CLI 是纯控制台程序，无 GUI 依赖
          & (Join-Path $dir "hzip.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "hzip.exe --version 退出码 $LASTEXITCODE" }

      - name: 静默卸载 + 断言无残留
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:ProgramFiles "hzip"
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/x", "${{ steps.msi.outputs.path }}", "/qn", "/norestart", "/l*v", "uninstall.log")
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 60; throw "msiexec /x 退出码 $($p.ExitCode)" }

          # 程序文件：安装目录可能留一个空壳（Windows 不删非空目录），故断言「没有文件残留」
          if (Test-Path $dir) {
            $left = Get-ChildItem $dir -Recurse -File
            if ($left) { throw "卸载后安装目录仍有文件：$($left.FullName -join ', ')" }
          }
          foreach ($lnk in @(
            (Join-Path $env:PUBLIC "Desktop\hzip.lnk"),
            (Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\hzip\hzip.lnk"))) {
            if (Test-Path $lnk) { throw "卸载后快捷方式仍在：$lnk" }
          }
          foreach ($k in @(
            "HKLM:\SOFTWARE\Classes\hzip.Archive",
            "HKLM:\SOFTWARE\hzip",
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\hzip.exe",
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\hzip-gui.exe")) {
            if (Test-Path $k) { throw "卸载后注册表项仍在：$k" }
          }
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($machinePath -like "*$dir*") { throw "卸载后 PATH 里仍留着安装目录" }
          Write-Host "卸载清理断言全部通过"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-logs
          path: |
            install.log
            uninstall.log
          if-no-files-found: ignore
          retention-days: 14

  # 汇总产物 → 重算全量 sha256sums.txt → 建 Release（softprops/action-gh-release，04 §6.1）。
  release:
    needs: [package, verify-msi]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-installers
          merge-multiple: true

      - name: 汇总产物 + 重算 sha256sums.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist-installers
          # 每格自带一份只含本格产物的 sha256sums.txt（下载合并后会互相覆盖）：
          # 丢掉它们，按最终文件集重算一份全量的（格式与驱动一致：`<digest>  <name>`）。
          rm -f sha256sums.txt
          # WiX 的 .wixpdb 是 MSI 的调试符号库（驱动不把它算作产物，也不进 sha256sums）：
          # 留在 artifact 里供排查，但不作为 Release 资产发出去。
          rm -f ./*.wixpdb
          sha256sum * > sha256sums.txt
          echo "--- 发布物（$(wc -l < sha256sums.txt) 项）"
          cat sha256sums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: hzip ${{ inputs.tag || github.ref_name }}
          files: dist-installers/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
