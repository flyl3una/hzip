zh-CN = "资源管理器右键「压缩」菜单里出现哪些格式。"

[setting.extract_smart.label]
en = "Smart extract"
zh-CN = "智能解压"

[setting.extract_smart.help]
en = "When the archive wraps everything in a single folder, extract its contents directly without the extra folder."
zh-CN = "压缩包只包一层目录时，解压后直接取出里面的内容，不多套一层文件夹。"

[setting.extract_conflict.label]
en = "Conflict policy"
zh-CN = "冲突策略"

[setting.extract_conflict.help]
en = "What to do when a file with the same name already exists on disk."
zh-CN = "解压遇到同名文件时的处理方式。"

[setting.extract_best_effort.label]
en = "Best effort"
zh-CN = "尽力而为"

[setting.extract_best_effort.help]
en = "Skip files that fail and keep extracting the rest instead of aborting the whole job."
zh-CN = "个别文件解压失败时跳过并继续其余，而不是整单中止。"

[setting.extract_codepage.label]
en = "Filename encoding"
zh-CN = "文件名编码"

[setting.extract_codepage.help]
en = "Pick the filename encoding for old archives with garbled names; Auto detects it for you."
zh-CN = "文件名乱码的老压缩包可手动指定编码；「自动」为自动检测。"

[setting.notify_on_finish.label]
en = "Notify on finish"
zh-CN = "完成通知"


[setting.progress_window.label]
en = "Progress window"
zh-CN = "进度窗口"


[setting.exit_on_finish.label]
en = "Quit when finished"
zh-CN = "完成后退出"


[setting.format.label]
en = "Default format"
zh-CN = "默认格式"


[setting.level.label]
en = "Default level"
zh-CN = "默认级别"


[setting.keep_metadata.label]
en = "Keep metadata"
