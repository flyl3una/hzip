[setting.keymap.label]
en = "Shortcuts"
zh-CN = "快捷键"

[setting.keymap.help]
en = "Click a shortcut and press the combination you want \u2014 it takes effect as soon as the shortcut loses focus. Esc cancels the edit, \u2715 removes the shortcut from that action, and \u201cReset all shortcuts\u201d in the page header restores every shortcut to its default."
zh-CN = "点键位后按下想用的组合键，移开焦点即生效；Esc 取消本次编辑；点 ✕ 删除该动作的快捷键绑定；页头「全部恢复默认」可一键复原全部快捷键。"

