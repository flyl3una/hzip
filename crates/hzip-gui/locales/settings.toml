zh-CN = "列表顶部显示一行「..」，双击可返回上一级目录。"

[setting.auto_update.label]
en = "Automatic updates"
zh-CN = "自动更新"

[setting.auto_update.help]
en = "Check for a new version on startup (not implemented yet, the preference is saved)."
zh-CN = "启动时自动检查新版本（该功能尚未实现，目前仅保存偏好）。"

[setting.assoc.label]
en = "File associations"
zh-CN = "关联格式"

[setting.assoc.help]
en = 'Double-clicking these archive types opens them in hzip. "Apply associations" registers hzip and makes it the effective handler: it clears the system user-choice layer (FileExts\\UserChoice) and removes other programs from the per-user "Open with" list for the ticked formats (they are restored by "Remove associations"). Windows may ask for elevation (UAC) if a step needs admin rights. Cost: your earlier explicit default choices are discarded and cannot be restored.'
zh-CN = "勾选后双击这类压缩包即用 hzip 打开。点「应用关联」会注册 hzip 并让它**真正生效**：清掉系统里的「用户显式选择」层（FileExts\\UserChoice），并把这些格式在**每用户「打开方式」列表**里的其它程序摘掉（点「解除关联」会原样还回去）。若某一步需要管理员权限，会弹出 UAC 提权确认。代价：这些格式此前由你在系统 UI 里做过的默认选择会被丢弃且无法还原。"

[assoc.group.archive]
en = "Archive containers"
zh-CN = "归档容器"

[assoc.group.composite]
en = "tar archives (with compression)"
zh-CN = "tar 复合归档"

[assoc.group.stream]
en = "Single-stream compression"
zh-CN = "单流压缩"

[setting.ctx_extract.label]
en = "Extract menu"
zh-CN = "解压菜单"

[setting.ctx_extract.help]
en = 'Which formats appear in the Explorer right-click "Extract" menu.'
zh-CN = "资源管理器右键「解压」菜单里出现哪些格式。"

[setting.ctx_compress.label]
