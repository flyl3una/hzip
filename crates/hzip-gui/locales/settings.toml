# —— 文件关联页：双击实况状态行（谁真的会打开它）+「打开方式」夺回入口 ——
# 语义边界：勾选只落盘；「应用关联」写 HKCU；被 UserChoice 占着的格式写不进去，
# 只能由用户在系统对话框里勾一次「始终使用此应用」。

[setting.assoc_status.label]
en = "Double-click opens"
zh-CN = "双击打开"

[setting.assoc_status.desc]
en = 'Who actually opens these formats when double-clicked in the file manager, grouped by the set you ticked. On Linux (mimeapps.list) and macOS (LaunchServices) "Apply associations" writes the default directly. On Windows it also clears the protected user-choice layer, so a format listed below as still owned by another program means that cleanup failed — the button opens the system Default apps settings as a fallback.'
zh-CN = "在文件管理器里双击这些格式时，实际由哪个程序打开（按当前勾选的集合分组列出）。Linux（mimeapps.list）与 macOS（LaunchServices）上「应用关联」直接写默认；Windows 上它同时清掉受保护的「用户显式选择」层，因此若下面仍显示某格式归别的程序，说明那次清理没有成功——旁边的按钮会打开系统「默认应用」设置作为兜底途径。"

[assoc.failed.title]
en = "File association failed"
zh-CN = "文件关联操作失败"

[assoc.failed.partial_title]
en = "Some formats were not taken over"
zh-CN = "部分格式没有接管成功"

[assoc.failed.items]
en = "These formats were not taken over:\n{items}"
zh-CN = "这些格式没有接管成功：\n{items}"

[assocstatus.none]
en = "No formats selected yet"
zh-CN = "尚未勾选任何格式"

[assocstatus.effective]
en = "Opened by hzip: {exts}"
zh-CN = "已由 hzip 打开：{exts}"

[assocstatus.pending]
en = 'Will open in hzip after "Apply associations": {exts}'
zh-CN = "点「应用关联」后由 hzip 打开：{exts}"

[assocstatus.blocked]
en = "{exts} is still opened by {owner}"
zh-CN = "{exts} 目前仍由 {owner} 打开"

[assocstatus.open_settings]
en = "Open system Default apps settings"
zh-CN = "打开系统「默认应用」设置"

[assocstatus.failed]
en = "System operation failed: {reason}"
zh-CN = "系统操作失败：{reason}"

# —— 快捷键页（T-KEYS）——
# 行文案 = `setting.keymap.label`；`keymap.action.<config_key>` 的动作名由
# `ui::shell::keymap::ACTIONS` 的 label 引用（config_key = TOML 字段名，
