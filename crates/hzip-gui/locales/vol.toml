# 磁盘镜像（卷层）文案表（T-IMG；键由 `hzip-vol`/各驱动经 `Unsupported`/`Quota`
# 与 `ReadOnlyReason::key()` 给出）。
#
# 生成/校验：`cargo test -p hzip-gui vol_locale`（逐键断言 en 与 zh-CN 都非空）。
# 新增键时用下面这条重列清单，再补文案：
#   grep -rhoE '\"vol\.[a-z0-9.-]+\"' crates | sort -u

_meta = { generated = "hzip-gui i18n" }
_version = 2

[vol.err.audit]
