[package]
name = "hzip-fmt-qcow2"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "hzip qcow2 磁盘镜像容器（读+写；计划 docs/tasks/T-IMG/T-IMG7-qcow2容器.md）"

[dependencies]
hzip-format  = { workspace = true }
hzip-error   = { workspace = true }
hzip-vol     = { workspace = true }
hzip-progress = { workspace = true }   # 取消令牌（handler 建索引/编辑器应用变更）
rust-img-qcow2 = { workspace = true }
tracing      = { workspace = true }

[dev-dependencies]
hzip-format-testkit = { workspace = true, features = ["vol"] }
hzip-progress       = { workspace = true }
hzip-fs-ext4        = { workspace = true }   # 端到端用真实 ext4 驱动（R1 只管 fmt-* 之间零依赖）
tempfile            = { workspace = true }
sha2                = { workspace = true }

[lints]
workspace = true
